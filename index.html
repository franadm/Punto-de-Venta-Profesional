<!DOCTYPE html>
<html lang="es-AR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ventas">
<meta name="theme-color" content="#F2F2F7">
<meta name="description" content="Sistema de ventas para negocios chicos: productos, tickets, fiados, historial y reportes. Funciona sin internet.">
<title>Sistema de Ventas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
/* Aplica el tema antes de pintar para evitar el "flash" blanco */
(function(){try{var d=JSON.parse(localStorage.getItem('sv2_data')||'null');var t=localStorage.getItem('sv2_theme')||(d&&d.config&&d.config.theme)||localStorage.getItem('theme')||'auto';
var dark=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.setAttribute('data-theme',dark?'dark':'light');
var m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#000000':'#F2F2F7';}catch(e){}})();
</script>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --tab-h:58px;
  --r-s:10px;--r-m:14px;--r-l:20px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F2F2F7;--card:#FFFFFF;--elev:#F2F2F7;--text:#111114;--text2:#5C5C63;--text3:#8A8A90;
  --sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --bar:rgba(249,249,251,.82);
  --blue:#0062CC;--btn-blue:#0071E3;--green:#1E7B3A;--btn-green:#1F8A3F;--red:#C4281C;--orange:#B25B00;--wa:#16813F;
  --blue-t:rgba(0,113,227,.12);--green-t:rgba(30,123,58,.13);--red-t:rgba(196,40,28,.12);--orange-t:rgba(178,91,0,.13);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;--card:#1C1C1E;--elev:#1C1C1E;--text:#F5F5F7;--text2:#A9A9B0;--text3:#7C7C83;
  --sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --bar:rgba(22,22,24,.8);
  --blue:#4DA3FF;--btn-blue:#0A74E8;--green:#32D060;--btn-green:#1F8A3F;--red:#FF6B61;--orange:#FFA733;--wa:#1B8F49;
  --blue-t:rgba(77,163,255,.16);--green-t:rgba(50,208,96,.16);--red-t:rgba(255,107,97,.16);--orange-t:rgba(255,167,51,.16);
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
/* Sin zoom por doble toque ni pellizco: solo se permite desplazar */
html,body,#app,main,.sheet,.sheet-body,.dialog-wrap,.tabbar,.topbar{touch-action:pan-x pan-y}
button,input,select,label,summary,.row,.tab,.chip,.card,.list,.stat,.line,.bar{touch-action:pan-x pan-y}
html.locked,html.locked body{overflow:hidden}
body{margin:0;font:16px/1.35 var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
  padding-left:var(--sal);padding-right:var(--sar);min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;touch-action:pan-x pan-y;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
svg{display:block;flex:none}
h1,h2,h3,p{margin:0}
.hidden{display:none!important}
.muted{color:var(--text2)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Layout ---------- */
.wrap{max-width:640px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 6px) 16px 8px;background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--sep)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.topbar h1{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.topbar .sub{font-size:13px;color:var(--text2);margin-top:2px}
main{padding:8px 16px calc(var(--tab-h) + var(--sab) + 96px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bar);padding:0 var(--sal) var(--sab) var(--sar);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;
  color:var(--text3);font-size:11px;font-weight:600;min-height:44px;padding:4px 0}
.tab[aria-selected="true"]{color:var(--blue)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);box-sizing:content-box}
[data-theme="dark"] .tab .badge{color:#000}

/* ---------- Components ---------- */
.icon-btn{position:relative;width:44px;height:44px;border-radius:22px;border:0;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:active{background:var(--fill2)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:10px;height:10px;border-radius:5px;background:var(--orange);border:2px solid var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-m);border:0;font-weight:700;font-size:16px;background:var(--fill);color:var(--text);transition:transform .12s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:var(--btn-blue);color:#fff}
.btn.success{background:var(--btn-green);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.danger{background:var(--red-t);color:var(--red)}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:12px}
.btn-text{background:none;border:0;color:var(--blue);font-weight:600;min-height:44px;padding:0 8px}
.btn-text.danger{color:var(--red)}
.fab{position:fixed;right:max(16px,calc(50% - 320px + 16px));bottom:calc(var(--tab-h) + var(--sab) + 16px);z-index:25;height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;
  background:var(--btn-blue);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,80,200,.35)}
.fab:active{transform:scale(.96)}
.searchbar{position:relative;margin:4px 0 12px}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.searchbar input{padding-left:42px}
input,select,textarea{width:100%;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid transparent;background:var(--fill);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:var(--card)}
input::placeholder{color:var(--text3)}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1 1.5l5 5 5-5' fill='none' stroke='%238A8A90' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:0 0 6px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{color:var(--red);font-size:14px;font-weight:600;min-height:0;margin:-4px 4px 10px}
.form-error:empty{display:none}
.section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:20px 4px 8px}
.card{background:var(--card);border-radius:var(--r-l);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.list{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.list>.row+.row{border-top:.5px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;background:none;border:0;text-align:left;color:inherit}
button.row:active{background:var(--fill)}
button.row[disabled]{opacity:.45;pointer-events:none}
.row-main{flex:1 1 120px;min-width:0}
.row-title{font-weight:700;font-size:16px;overflow-wrap:break-word;word-break:normal}
.row-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:3px;font-size:13px;color:var(--text2)}
.row-price{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{color:var(--text3)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:700;background:var(--fill);color:var(--text2)}
.pill.ok{background:var(--green-t);color:var(--green)}.pill.low{background:var(--orange-t);color:var(--orange)}
.pill.out{background:var(--red-t);color:var(--red)}.pill.blue{background:var(--blue-t);color:var(--blue)}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--blue-t);color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.avatar.red{background:var(--red-t);color:var(--red)}.avatar.green{background:var(--green-t);color:var(--green)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--card);color:var(--text);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--btn-blue);color:#fff}
.segmented{display:flex;padding:3px;border-radius:12px;background:var(--fill);gap:2px;margin-bottom:14px}
.segmented button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:600;font-size:14px;color:var(--text2);padding:0 4px}
.segmented button[aria-checked="true"],.segmented button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.stepper{display:inline-flex;align-items:center;gap:2px;background:var(--fill);border-radius:12px;padding:2px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:none;display:flex;align-items:center;justify-content:center;color:var(--text)}
.stepper button:active{background:var(--fill2)}
.stepper input{width:44px;min-height:40px;padding:0;text-align:center;font-weight:700;background:transparent;border-radius:8px}
.empty{text-align:center;padding:44px 24px;color:var(--text2)}
.empty .ring{width:72px;height:72px;margin:0 auto 14px;border-radius:36px;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--text3)}
.empty h3{font-size:18px;color:var(--text);margin-bottom:6px}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--blue-t);color:var(--text);border-radius:var(--r-m);padding:14px;margin:4px 0 14px;font-size:14px}
.banner b{display:block;margin-bottom:2px}
.banner .x{margin-left:auto;background:none;border:0;color:var(--text2);width:32px;height:32px;display:flex;align-items:center;justify-content:center;flex:none}
details>summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--blue);font-weight:600;font-size:14px}
details>summary::-webkit-details-marker{display:none}
.lines{margin:4px 0 2px}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;border-top:.5px dashed var(--sep)}
.line span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.big{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.red{color:var(--red)}.green{color:var(--green)}
.totals{background:var(--card);border-radius:var(--r-l);padding:14px 16px;margin:16px 0 8px}
.totals .t{display:flex;justify-content:space-between;padding:4px 0;color:var(--text2);font-variant-numeric:tabular-nums}
.totals .t.final{color:var(--text);font-size:22px;font-weight:800;border-top:.5px solid var(--sep);margin-top:6px;padding-top:10px}
.vuelto{margin:-4px 4px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r-l);padding:14px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.stat small{display:block;color:var(--text2);font-weight:600;font-size:13px;margin-bottom:4px}
.stat b{display:block;font-size:clamp(18px,5.6vw,22px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--text2)}
.bar i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--btn-blue);min-height:3px}
.bar.zero i{background:var(--fill2)}
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--btn-blue);border-radius:4px}
.paybar{padding:10px 0}.paybar .top{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.paybar .top span:last-child{font-variant-numeric:tabular-nums}

/* ---------- Sheets / dialogs / toast ---------- */
.sheet-wrap{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);z-index:100;display:flex;align-items:flex-end;justify-content:center;touch-action:pan-y}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s;touch-action:none}
.sheet{position:relative;width:100%;max-width:600px;max-height:calc(100% - var(--sat) - 10px);display:flex;flex-direction:column;background:var(--elev);
  border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s var(--ease);box-shadow:0 -8px 40px rgba(0,0,0,.25);overflow:hidden}
.sheet.tall{height:calc(100% - var(--sat) - 10px)}
.sheet-wrap.open .backdrop{opacity:1}.sheet-wrap.open .sheet{transform:none}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--fill2);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px 8px 20px;flex:none}
.sheet-head h2{font-size:20px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px 20px}
.sheet-foot{flex:none;display:flex;gap:10px;padding:12px 16px calc(12px + var(--sab));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--sep)}
.sheet-foot .btn{flex:1;padding:0 8px}
.sheet-foot .btn.grow2{flex:1.6}
.dialog-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45);opacity:0;transition:opacity .18s}
.dialog-wrap.open{opacity:1}
.dialog{width:100%;max-width:310px;background:var(--card);border-radius:20px;overflow:hidden;text-align:center;transform:scale(.94);transition:transform .22s var(--ease);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dialog-wrap.open .dialog{transform:none}
.dialog .body{padding:22px 20px 18px}.dialog h3{font-size:18px;font-weight:800;margin-bottom:6px}.dialog p{color:var(--text2);font-size:15px;overflow-wrap:anywhere}
.dlg-actions{display:flex;border-top:.5px solid var(--sep)}
.dlg-btn{flex:1;min-height:50px;background:none;border:0;font-size:17px;color:var(--blue);font-weight:500}
.dlg-btn+.dlg-btn{border-left:.5px solid var(--sep);font-weight:800}
.dlg-btn.destructive{color:var(--red)}
.dlg-btn:active{background:var(--fill)}
.toast{position:fixed;left:50%;top:calc(var(--sat) + 10px);transform:translate(-50%,-140%);z-index:300;max-width:min(92vw,420px);padding:12px 18px;border-radius:24px;
  background:rgba(28,28,30,.94);color:#fff;font-weight:600;font-size:15px;text-align:center;transition:transform .35s var(--ease);box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.toast.ok::before{content:"✓ ";color:#5BE585}.toast.warn::before{content:"! ";color:#FFC247}.toast.err::before{content:"✕ ";color:#FF7B72}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
@media (min-width:700px){.sheet{border-radius:24px;margin-bottom:24px;max-height:calc(100% - 48px)}.sheet.tall{height:calc(100% - 48px)}}

/* ---------- Impresión ---------- */
#print-area{display:none}
@media print{
  @page{margin:8mm}
  html,body{background:#fff!important;color:#000!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-family:"Courier New",monospace;font-size:13px;max-width:80mm;margin:0 auto;color:#000}
  #print-area h2{text-align:center;font-size:17px;margin:0 0 2px}
  #print-area .c{text-align:center}
  #print-area hr{border:0;border-top:1px dashed #000;margin:8px 0}
  #print-area .r{display:flex;justify-content:space-between;gap:8px}
  #print-area .tot{font-size:16px;font-weight:700}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar"><div class="wrap">
    <div><h1 id="title">Productos</h1><div class="sub" id="subtitle"></div></div>
    <button class="icon-btn" id="btn-settings" data-act="settings" aria-label="Configuración"></button>
  </div></header>
  <main><div class="wrap" id="view"></div></main>
  <nav class="tabbar" aria-label="Secciones"><div class="wrap" role="tablist" id="tabs"></div></nav>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="print-area" aria-hidden="true"></div>

<script>
(() => {
'use strict';

/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const groupInt = t => t.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const money = n => {
  n = round2(+n || 0); const neg = n < 0; n = Math.abs(n);
  let [i, d] = n.toFixed(2).split('.'); if (d === '00') d = '';
  return (neg ? '-' : '') + '$\u00a0' + groupInt(i) + (d ? ',' + d : '');
};
const bigFs = v => { const n = money(v).length; return n <= 11 ? '' : n <= 14 ? ' style="font-size:20px"' : ' style="font-size:16px"'; };
/* Número para mostrar dentro de un campo de texto: 1500.5 -> "1.500,5" */
const fmtInput = n => { n = round2(+n || 0); let [i, d] = n.toFixed(2).split('.'); if (d === '00') d = ''; return groupInt(i) + (d ? ',' + d : ''); };
/* Máscara en vivo para campos de dinero: agrega el punto de miles mientras se escribe */
function maskMoney(el) {
  const raw = el.value, pos = el.selectionStart ?? raw.length;
  const keep = raw.slice(0, pos).replace(/[^\d,]/g, '').length;
  const s = raw.replace(/[^\d,]/g, ''), ci = s.indexOf(',');
  let ip = ci < 0 ? s : s.slice(0, ci); const dec = ci < 0 ? null : s.slice(ci + 1).replace(/,/g, '').slice(0, 2);

  return d;
}

let toastT;
function toast(msg, kind = 'ok') {
  const el = $('#toast'); el.textContent = msg; el.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), kind === 'ok' ? 2200 : 3600);
}
function confirmDialog({title, message, confirmText = 'Aceptar', cancelText = 'Cancelar', destructive = false}) {
  return new Promise(resolve => {
    const wrap = document.createElement('div'); wrap.className = 'dialog-wrap';
    wrap.setAttribute('role', 'alertdialog'); wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML = `<div class="dialog"><div class="body"><h3>${esc(title)}</h3><p>${esc(message || '')}</p></div>
      <div class="dlg-actions"><button class="dlg-btn" data-r="0">${esc(cancelText)}</button><button class="dlg-btn ${destructive ? 'destructive' : ''}" data-r="1">${esc(confirmText)}</button></div></div>`;
    document.body.appendChild(wrap);
    requestAnimationFrame(() => wrap.classList.add('open'));
    const done = v => { document.removeEventListener('keydown', onKey, true); wrap.classList.remove('open'); setTimeout(() => wrap.remove(), 180); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    wrap.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); else if (e.target === wrap) done(false); });
    $('[data-r="0"]', wrap).focus();
  });
}
const sheets = [];
function openSheet({title, body, footer, tall = false, onClose, onOpen}) {
  const wrap = document.createElement('div'); wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="backdrop" data-act="sheet-close"></div>
    <section class="sheet ${tall ? 'tall' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grabber"></div>
      <header class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="sheet-close" aria-label="Cerrar">${ic('x')}</button></header>
      <div class="sheet-body">${body}</div>${footer ? `<footer class="sheet-foot">${footer}</footer>` : ''}</section>`;
  wrap._onClose = onClose;
  document.body.appendChild(wrap);
  sheets.push(wrap);
  document.documentElement.classList.add('locked');
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add('open')));
  if (onOpen) onOpen(wrap);
  return wrap;
}
function closeSheet(wrap) {
  if (!wrap || wrap._closing) return;
  wrap._closing = true;
  const i = sheets.indexOf(wrap); if (i >= 0) sheets.splice(i, 1);
  wrap.classList.remove('open');
  if (document.activeElement && wrap.contains(document.activeElement)) document.activeElement.blur();
  setTimeout(() => { wrap.remove(); if (!sheets.length) document.documentElement.classList.remove('locked'); }, 260);
  if (wrap._onClose) wrap._onClose();
  refresh();
}

  if (!Number.isFinite(price) || price < 0) return fail('Ingresá un precio válido (ej: 1500 o 1500,50).');
  if (!Number.isFinite(stock) || stock < 0 || !Number.isInteger(stock)) return fail('El stock debe ser un número entero (0 o más).');

function tkSetQty(pid, qty, w) {
  const t = getTicket(w.dataset.tid), p = getProd(pid); if (!t || !p) return;
  qty = Math.floor(qty);
  if (!(qty > 0)) delete t.items[pid];
  else if (qty > p.stock) { t.items[pid] = Math.max(0, p.stock); if (p.stock <= 0) delete t.items[pid]; toast(`Stock insuficiente: quedan ${p.stock} de ${p.name}`, 'warn'); }
  else t.items[pid] = qty;

async function deleteTicket(w) {
  const t = getTicket(w.dataset.tid); if (!t) return;
  const ok = await confirmDialog({title:'¿Eliminar ticket?', message:`Se descartará el ticket de ${t.name} sin cobrar. No se modifica el stock.`, confirmText:'Eliminar', destructive:true});
  if (!ok) return;
  S.tickets = S.tickets.filter(x => x.id !== t.id); persist(); closeSheet(w); toast('Ticket eliminado');
}
async function cobrarTicket(w) {
  const t = getTicket(w.dataset.tid); if (!t) return;
  const lines = ticketLines(t);
  if (!lines.length) { toast('Agregá al menos un producto', 'warn'); return; }
  const short = lines.find(l => l.qty > l.stock);
  if (short) { toast(`Stock insuficiente de ${short.name}: quedan ${short.stock}`, 'err'); return; }
  const total = ticketTotal(t), fiado = t.payment === 'Fiado';
  const ok = await confirmDialog(fiado
    ? {title:'Registrar fiado', message:`${t.name} quedará debiendo ${money(total)}. Se descuenta el stock.`, confirmText:'Registrar fiado'}
    : {title:'Confirmar cobro', message:`${money(total)} en ${t.payment.toLowerCase()} a ${t.name}. Se descuenta el stock.`, confirmText:'Cobrar'});
  if (!ok) return;
  const t2 = getTicket(t.id); if (!t2) return;                       // pudo cambiar mientras había un diálogo abierto
  const L = ticketLines(t2);
  if (L.some(l => l.qty > l.stock)) { toast('El stock cambió. Revisá las cantidades.', 'err'); tkAll(w); return; }
  const ts = Date.now(), sid = uid(), snap = L.map(l => ({pid:l.pid, name:l.name, price:l.price, qty:l.qty}));
  L.forEach(l => { getProd(l.pid).stock -= l.qty; S.ventasLog.push({id:uid(), sid, ts, pid:l.pid, name:l.name, qty:l.qty, amount:round2(l.price * l.qty)}); });
  if (fiado) {
    const carga = {id:sid, ts, lines:snap, total, note:t2.note};
    const f = S.fiados.find(x => x.name === t2.name);
    if (f) { f.cargas.push(carga); f.saldo = round2(f.saldo + total); } else S.fiados.unshift({id:uid(), name:t2.name, saldo:total, cargas:[carga]});
  } else {
    S.historial.unshift({id:sid, seq:nextSeq(), type:'venta', name:t2.name, ts, payment:t2.payment, surcharge:t2.payment === 'Tarjeta' ? effSur(t2) : 0, subtotal:ticketSub(t2), recargo:ticketRec(t2), total, lines:snap, note:t2.note});
  }
  S.tickets = S.tickets.filter(x => x.id !== t2.id);
  persist(); closeSheet(w); toast(fiado ? 'Fiado registrado' : `Venta registrada · ${money(total)}`);
}

async function abonarFiado(id) {
  const f = S.fiados.find(x => x.id === id); if (!f) return;
  const input = $(`#abono-${CSS.escape(id)}`), v = parseNum(input.value);
  if (!Number.isFinite(v) || v <= 0) { toast('Ingresá un monto válido para abonar', 'warn'); input.focus(); return; }
  const amount = round2(v);
  if (amount > f.saldo) { toast(`El monto supera la deuda (${money(f.saldo)}). Usá “Liquidar todo”.`, 'warn'); return; }
  if (amount === f.saldo) return liquidarFiado(id);
  const ok = await confirmDialog({title:'Registrar abono', message:`${f.name} entrega ${money(amount)}. Quedará debiendo ${money(round2(f.saldo - amount))}.`, confirmText:'Registrar'});
  if (!ok) return;
  const f2 = S.fiados.find(x => x.id === id); if (!f2 || amount > f2.saldo) return;
  f2.saldo = round2(f2.saldo - amount);
  S.historial.unshift({id:uid(), seq:nextSeq(), type:'abono', name:f2.name, ts:Date.now(), payment:'Abono de fiado', surcharge:0, subtotal:amount, recargo:0, total:amount, lines:[], note:`Saldo restante: ${money(f2.saldo)}`});
  persist(); refresh(); toast(`Abono registrado · resta ${money(f2.saldo)}`);
}
async function liquidarFiado(id) {
  const f = S.fiados.find(x => x.id === id); if (!f) return;
  const ok = await confirmDialog({title:'Liquidar cuenta', message:`Se registra el cobro de ${money(f.saldo)} a ${f.name} y la cuenta queda en cero.`, confirmText:'Liquidar'});
  if (!ok) return;
  const f2 = S.fiados.find(x => x.id === id); if (!f2) return;
  const lines = f2.cargas.flatMap(c => c.lines);
  S.historial.unshift({id:uid(), seq:nextSeq(), type:'liquidacion', name:f2.name, ts:Date.now(), payment:'Liquidación de fiado', surcharge:0, subtotal:f2.saldo, recargo:0, total:f2.saldo, lines, note:'Cuenta saldada'});
  S.fiados = S.fiados.filter(x => x.id !== id);
  persist(); refresh(); toast('Cuenta saldada');
}
async function deleteFiado(id) {
  const f = S.fiados.find(x => x.id === id); if (!f) return;
  const ok = await confirmDialog({title:'¿Eliminar deuda?', message:`Se borra la deuda de ${f.name} (${money(f.saldo)}) sin cobrarla. El stock ya descontado no se devuelve.`, confirmText:'Eliminar', destructive:true});
  if (!ok) return;
  S.fiados = S.fiados.filter(x => x.id !== id); persist(); refresh(); toast('Deuda eliminada');
}
function waFiado(id) {
  const f = S.fiados.find(x => x.id === id); if (!f) return;
  const m$ = n => money(n).replace(/\s/g, '');                                  // "$3.500" sin saltos de línea raros
  const cap = capWords;
  const day = ts => ts ? new Date(ts).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'}) : 'Sin fecha';
  const byDay = new Map();
  f.cargas.forEach(c => { const k = day(c.ts); if (!byDay.has(k)) byDay.set(k, []);
    if (c.lines.length) c.lines.forEach(l => byDay.get(k).push(`• ${cap(l.name)} x${l.qty} — ${m$(l.price * l.qty)}`));
    else byDay.get(k).push(`• Cargo — ${m$(c.total)}`); });
  const cargado = round2(f.cargas.reduce((a, c) => a + c.total, 0)), pagado = round2(cargado - f.saldo);
  let msg = `Hola *${cap(f.name)}*,\nTe escribimos de *${S.config.negocio || 'el negocio'}* para recordarte tu saldo pendiente.\n\n*Detalle de compras*\n`;
  byDay.forEach((items, k) => { msg += `\n${k}\n${items.join('\n')}\n`; });
  if (pagado > 0) msg += `\nTotal de compras: ${m$(cargado)}\nPagado: -${m$(pagado)}\n`;
  msg += `\n*Saldo a pagar: ${m$(f.saldo)}*\n\n¡Gracias!`;
  const tk = S.tickets.find(t => t.name === f.name);
  openWhatsApp(msg, tk ? tk.phone : '');
}

async function undoSale(id) {
  const h = S.historial.find(x => x.id === id && x.type === 'venta'); if (!h) return;
  const ok = await confirmDialog({title:'¿Anular esta venta?', message:`Se quita la venta de ${h.name} por ${money(h.total)} y se devuelve el stock de los productos.`, confirmText:'Anular venta', destructive:true});

}

/* ---------- Reportes ---------- */
function periodStart(p) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (p === 'hoy') return d.getTime();
  if (p === '7d') return d.getTime() - 6 * DAY;
  if (p === 'mes') { d.setDate(1); return d.getTime(); }
  return 0;
}
function renderReportes() {
  const start = periodStart(UI.period), inP = x => UI.period === 'todo' ? true : (x.ts != null && x.ts >= start);
  const hist = S.historial.filter(inP), ventas = hist.filter(h => h.type === 'venta');
  const ingresos = round2(hist.reduce((a, h) => a + h.total, 0));
  const ticketProm = ventas.length ? round2(ventas.reduce((a, h) => a + h.total, 0) / ventas.length) : 0;
  const deuda = round2(S.fiados.reduce((a, f) => a + f.saldo, 0));
  const stockVal = round2(S.productos.reduce((a, p) => a + p.price * p.stock, 0));
  const units = S.ventasLog.filter(inP).reduce((a, x) => a + x.qty, 0);
  const groups = {Efectivo:0, Transferencia:0, Tarjeta:0, 'Cobro de fiados':0};
  hist.forEach(h => { const k = h.type === 'venta' ? (groups[h.payment] !== undefined ? h.payment : 'Efectivo') : 'Cobro de fiados'; groups[k] = round2(groups[k] + h.total); });
  const maxG = Math.max(...Object.values(groups), 1);
  const rank = {}; S.ventasLog.filter(inP).forEach(x => { const k = x.pid || x.name; rank[k] = rank[k] || {name:x.name, qty:0, amount:0}; rank[k].qty += x.qty; rank[k].amount = round2(rank[k].amount + x.amount); });
  const top = Object.values(rank).sort((a, b) => b.qty - a.qty).slice(0, 5);
  const days = []; for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({s:d.getTime(), e:d.getTime() + DAY, label:d.toLocaleDateString('es-AR', {weekday:'short'}).replace('.', '').slice(0, 3), v:0}); }
  S.historial.forEach(h => { if (h.ts == null) return; const d = days.find(x => h.ts >= x.s && h.ts < x.e); if (d) d.v = round2(d.v + h.total); });
  const maxD = Math.max(...days.map(d => d.v), 1);
  const low = S.productos.filter(p => p.stock <= LOW_STOCK).sort((a, b) => a.stock - b.stock).slice(0, 6);
  const fs = v => { const n = money(v).length; return n <= 10 ? '' : n <= 13 ? ' style="font-size:18px"' : ' style="font-size:15px"'; };
  const seg = [['hoy', 'Hoy'], ['7d', '7 días'], ['mes', 'Este mes'], ['todo', 'Todo']];
  $('#rep').innerHTML = `<div class="segmented" role="group" aria-label="Período">${seg.map(([k, l]) => `<button data-act="period" data-v="${k}" aria-pressed="${UI.period === k}">${l}</button>`).join('')}</div>
    <div class="stats"><div class="stat"><small>Ingresos cobrados</small><b class="green"${fs(ingresos)}>${money(ingresos)}</b></div>
      <div class="stat"><small>Ventas</small><b>${ventas.length}</b></div>
      <div class="stat"><small>Ticket promedio</small><b${fs(ticketProm)}>${money(ticketProm)}</b></div>
      <div class="stat"><small>Unidades vendidas</small><b>${units}</b></div>
      <div class="stat"><small>Fiados por cobrar</small><b class="${deuda ? 'red' : ''}"${fs(deuda)}>${money(deuda)}</b></div>
      <div class="stat"><small>Stock valorizado</small><b${fs(stockVal)}>${money(stockVal)}</b></div></div>
    <div class="section-title">Últimos 7 días</div>
    <div class="card" role="img" aria-label="Ingresos por día: ${days.map(d => d.label + ' ' + money(d.v)).join(', ')}"><div class="bars">${days.map(d => `<div class="bar ${d.v ? '' : 'zero'}"><i style="height:${Math.max(3, Math.round(d.v / maxD * 100))}%"></i><span>${d.label}</span></div>`).join('')}</div></div>
    <div class="section-title">Cómo te pagaron</div>
    <div class="card" style="padding:6px 16px">${Object.entries(groups).map(([k, v]) => `<div class="paybar"><div class="top"><span>${k}</span><span>${money(v)}</span></div><div class="meter"><i style="width:${Math.round(v / maxG * 100)}%"></i></div></div>`).join('')}</div>
    <div class="section-title">Más vendidos</div>
    ${top.length ? `<div class="list">${top.map((x, i) => `<div class="row" style="min-height:56px"><div class="avatar" style="width:34px;height:34px;font-size:15px">${i + 1}</div><div class="row-main"><div class="row-title">${esc(x.name)}</div><div class="row-sub">${money(x.amount)}</div></div><div class="row-price">${x.qty} u.</div></div>`).join('')}</div>` : `<div class="card muted" style="text-align:center">Sin ventas en este período.</div>`}
    <div class="section-title">Stock bajo</div>
    ${low.length ? `<div class="list">${low.map(p => `<button class="row" style="min-height:56px" data-act="prod-edit" data-id="${esc(p.id)}"><div class="row-main"><div class="row-title">${esc(p.name)}</div></div>${stockPill(p.stock)}<span class="chev">${ic('chev', 18)}</span></button>`).join('')}</div>` : `<div class="card muted" style="text-align:center">Todo el stock está en buen nivel.</div>`}`;
}

function applyTheme() {
  const t = S.config.theme, dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  try { localStorage.setItem('sv2_theme', t); } catch (e) {}
  $('meta[name=theme-color]').content = dark ? '#000000' : '#F2F2F7';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

/* ---------- Backup ---------- */
async function exportBackup() {
  const data = JSON.stringify({app:'sistema-ventas', version:2, fechaBackup:new Date().toISOString(), productos:S.productos, tickets:S.tickets, fiados:S.fiados, historial:S.historial, ventasLog:S.ventasLog, config:{negocio:S.config.negocio, telefono:S.config.telefono, recargo:S.config.recargo}}, null, 2);
  const name = `backup_ventas_${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([data], {type:'application/json'});
  const mark = () => { S.config.lastBackup = Date.now(); persist(); refresh(); };
  try {
    const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:'Backup Sistema de Ventas'}); mark(); toast('Backup listo'); return; }
  } catch (err) { if (err && err.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
  mark(); toast('Backup descargado');
}
function importBackup(file) {
  if (!file) return;
  const r = new FileReader();
  r.onerror = () => toast('No se pudo leer el archivo', 'err');
  r.onload = async () => {
    let data;
    try { data = JSON.parse(r.result); } catch (e) { toast('El archivo no es un backup válido (JSON dañado)', 'err'); return; }
    if (!data || typeof data !== 'object' || !Array.isArray(data.productos)) { toast('El archivo no tiene el formato de un backup', 'err'); return; }
    const next = normalize(data);
    const ok = await confirmDialog({title:'¿Restaurar este backup?', message:`Se reemplazan los datos actuales por: ${next.productos.length} productos, ${next.tickets.length} tickets, ${next.fiados.length} fiados y ${next.historial.length} movimientos.`, confirmText:'Restaurar', destructive:true});
    if (!ok) return;
    next.config = Object.assign({}, S.config, {negocio:data.config?.negocio ?? S.config.negocio, telefono:data.config?.telefono ?? S.config.telefono, recargo:next.config.recargo});
    S = next; fullRewrite = true; lastSeq = S.historial.reduce((m, h) => Math.max(m, h.seq || 0), 0); persist(); sheets.slice().forEach(closeSheet); applyTheme(); refresh(); toast('Backup restaurado');
  };
  r.readAsText(file);
}

  't-inc': el => { const w = el.closest('.sheet-wrap'), t = getTicket(w.dataset.tid), pid = el.dataset.pid; tkSetQty(pid, (t.items[pid] || 0) + 1, w); },
  't-dec': el => { const w = el.closest('.sheet-wrap'), t = getTicket(w.dataset.tid), pid = el.dataset.pid; tkSetQty(pid, (t.items[pid] || 0) - 1, w); },
  't-pay': el => { const w = el.closest('.sheet-wrap'), t = getTicket(w.dataset.tid); t.payment = el.dataset.v; persist();

  't-delete': el => deleteTicket(el.closest('.sheet-wrap')),

  't-print': el => { const t = getTicket(el.closest('.sheet-wrap').dataset.tid); if (!ticketLines(t).length) return toast('Agregá productos para imprimir', 'warn'); printReceipt(receiptData(t)); },
  'f-abonar': el => abonarFiado(el.dataset.id),
  'f-liquidar': el => liquidarFiado(el.dataset.id),

  'h-undo': el => undoSale(el.dataset.id),
  'h-more': () => { UI.histLimit += 40; renderHistorial(); },

  period: el => { UI.period = el.dataset.v; renderReportes(); },
  theme: el => { S.config.theme = el.dataset.v; persist(); applyTheme(); $$('[data-act=theme]', el.parentNode).forEach(b => b.setAttribute('aria-checked', String(b === el))); },
  'backup-export': () => exportBackup(),
  'backup-import': el => $('#import-file', el.closest('.sheet-wrap')).click(),
  creator: () => openCreator(),
  'off-check': el => showOffline(el.closest('.sheet-wrap')),
  'reset-all': async () => {
    if (!await confirmDialog({title:'¿Borrar TODOS los datos?', message:'Se eliminan productos, tickets, fiados e historial de este dispositivo.', confirmText:'Continuar', destructive:true})) return;
    if (!await confirmDialog({title:'Última confirmación', message:'Esta acción no se puede deshacer. ¿Seguro que querés borrar todo?', confirmText:'Sí, borrar todo', destructive:true})) return;
    const cfg = S.config; S = blank(); S.config = cfg; S.config.lastBackup = null; fullRewrite = true; lastSeq = 0; persist(); sheets.slice().forEach(closeSheet); refresh(); toast('Datos borrados');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;

const INP = {
  'q-prod': el => { UI.q.productos = el.value; UI.pLimit = 100; renderProductos(); },

  't-pagacon': el => { UI.pagaCon = el.value; tkVuelto(el.closest('.sheet-wrap')); },

  'pf-cat': el => { const n = el.value === '__new', w = $('#pf-newcat-wrap', el.closest('.sheet-wrap')); w.classList.toggle('hidden', !n); if (n) $('#pf-newcat', w).focus(); },
  's-neg': el => { S.config.negocio = el.value.trim() || 'Mi Negocio'; persist(true); },
  's-tel': el => { S.config.telefono = el.value.trim(); persist(true); },
  's-rec': el => { const v = parseNum(el.value); S.config.recargo = Number.isFinite(v) ? Math.min(100, Math.max(0, round2(v))) : 0; persist(true); refresh(); }
};
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.money !== undefined) maskMoney(e.target); const k = e.target.dataset && e.target.dataset.in; if (k && INP[k] && k !== 'pf-cat' && e.target.tagName !== 'SELECT') INP[k](e.target); });
document.addEventListener('change', e => {

  else if (k === 't-qty') { const w = el.closest('.sheet-wrap'); const v = parseNum(el.value); tkSetQty(el.dataset.pid, Number.isFinite(v) ? v : 0, w); }
});
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), {passive:true});

async function start() {

  booted = true;
  applyTheme();
  showTab('productos');
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
const started = start();

/* ---------- Modo sin internet ---------- */
async function offlineStatus() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol))
    return {ok:false, msg:'Este navegador no permite el modo sin internet. Abrí la app desde su dirección https:// y volvé a instalarla.'};
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg || !reg.active) return {ok:false, msg:'Preparando la app… mantenela abierta con internet unos segundos y tocá “Verificar ahora”.'};
    for (const k of await caches.keys()) { if (await (await caches.open(k)).match(new URL('index.html', reg.scope).href)) return {ok:true, msg:'Lista: la app abre y funciona sin internet.'}; }
    return {ok:false, msg:'Falta descargar la app. Conectate a internet y abrila de nuevo.'};
  } catch (e) { return {ok:false, msg:'No se pudo verificar. Probá de nuevo con internet.'}; }
}
async function showOffline(w) {
  const el = $('#off-status', w); if (!el) return;
  const r = await offlineStatus();
  el.innerHTML = `<span class="pill ${r.ok ? 'ok' : 'low'}" style="margin-right:8px">${r.ok ? 'Lista' : 'Pendiente'}</span>${esc(r.msg)}`;
}
window.addEventListener('offline', () => { toast('Sin internet. Podés seguir vendiendo normalmente.', 'warn'); refresh(); });
window.addEventListener('online', () => { toast('Conexión recuperada'); refresh(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('App actualizada. Cerrala y abrila para usar la versión nueva.'); });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
    Promise.all([navigator.serviceWorker.ready, started]).then(async () => {
      const r = await offlineStatus();
      if (r.ok && !S.config.offlineNotified) { S.config.offlineNotified = true; persist(); toast('Lista para usar sin internet'); }
    }).catch(() => {});
  });
}
window.__sv = {get S() { return S; }, normalize, parseNum, money, flush:() => flushNow(),
  setState: d => { S = normalize(d); fullRewrite = true; lastSeq = S.historial.reduce((m, h) => Math.max(m, h.seq || 0), 0); return flushNow(); }};   // para pruebas
})();
